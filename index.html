<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Pack Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        header {
            background: #111827;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
        }

        header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        select,
        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #resultado {
            display: none;
            margin-top: 25px;
        }

        .resultado-box {
            padding: 20px;
            border-radius: 12px;
            background: #f8fafc;
            margin-top: 15px;
        }

        .numero {
            font-size: 28px;
            font-weight: bold;
        }

        .nota {
            margin-top: 20px;
            color: #64748b;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>🃏 Pokémon Pack Calculator</h1>
    <p>Descubre el valor esperado de un sobre Pokémon</p>
</header>

<div class="container">

    <div class="card">

        <label for="set">Colección</label>

        <select id="set">
            <option value="rivales">Rivales Predestinados</option>
            <option value="megalegends">Megalegend</option>
            <option value="destined">Próximamente...</option>
        </select>

        <label for="precio">Precio del sobre (€)</label>

        <input
            type="number"
            id="precio"
            placeholder="Ejemplo: 5"
            min="0"
            step="0.01"
        >

        <button onclick="calcular()">
            Calcular
        </button>

        <div id="resultado">

            <div class="resultado-box">
                <p>💰 Valor esperado</p>
                <div class="numero" id="valorEsperado">-</div>
            </div>

            <div class="resultado-box">
                <p>📊 Retorno esperado</p>
                <div class="numero" id="retorno">-</div>
            </div>

            <div class="resultado-box">
                <p>📈 Resultado esperado</p>
                <div class="numero" id="beneficio">-</div>
            </div>

            <p class="nota">
                ⚠️ Los datos mostrados actualmente son de demostración.
                Más adelante utilizaremos datos reales y actualizados.
            </p>

        </div>

    </div>

</div>

<script>

function calcular() {

    const precio = parseFloat(
        document.getElementById("precio").value
    );

    if (!precio || precio <= 0) {
        alert("Introduce un precio válido.");
        return;
    }

    /*
       ESTO ES SOLO UNA PRUEBA.
       Más adelante sustituiremos este número
       por nuestro cálculo real basado en cartas,
       probabilidades y precios.
    */

    const valorEsperado = 3.50;

    const retorno = (valorEsperado / precio) * 100;

    const beneficio = valorEsperado - precio;

    document.getElementById("valorEsperado").textContent =
        valorEsperado.toFixed(2) + " €";

    document.getElementById("retorno").textContent =
        retorno.toFixed(1) + "%";

    document.getElementById("beneficio").textContent =
        (beneficio >= 0 ? "+" : "") +
        beneficio.toFixed(2) + " €";

    document.getElementById("resultado").style.display = "block";
}

</script>

</body>
</html>
