name: Actualizar precios Cardmarket

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descargar Price Guide de Cardmarket
        run: |
          curl -L \
            -A "Mozilla/5.0" \
            -o price_guide.json \
            "https://downloads.s3.cardmarket.com/productCatalog/priceGuide/price_guide_6.json"

      - name: Comprobar archivo
        run: |
          echo "Tamaño del archivo:"
          wc -c price_guide.json
          echo "Primeros caracteres:"
          head -c 300 price_guide.json

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price_guide.json
          git diff --cached --quiet || git commit -m "Actualizar precios Cardmarket"
          git push
